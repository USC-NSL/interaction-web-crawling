<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>hover-intent-menu</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; padding: 32px 24px 96px;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #1b1b1f; background: #fbfbfd;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .lede { margin: 0 0 28px; color: #55555f; }
  .nav { display: flex; gap: 8px; padding: 8px;
         border: 1px solid #d8d8e0; border-radius: 10px; background: #fff; }
  .nav-item { position: relative; }
  .nav-trigger {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    font-weight: 600; border-radius: 8px; cursor: default; user-select: none;
  }
  .nav-trigger:hover, .nav-item.is-open .nav-trigger { background: #f0f0f6; }
  .nav-menu {
    position: absolute; top: 100%; left: 0; margin-top: 6px; padding: 10px;
    min-width: 300px;
    border: 1px solid #d8d8e0; border-radius: 10px; background: #fff;
    box-shadow: 0 12px 28px rgba(20, 20, 40, 0.12);
    display: none;
  }
  .nav-item.is-open .nav-menu { display: block; }
  .nav-menu .row { display: flex; align-items: center; gap: 12px; padding: 8px; }
  .nav-menu img { width: 64px; height: 44px; flex: none; background: #e4e4ee; border-radius: 4px; }
  .nav-menu .meta { font-size: 13px; color: #6a6a76; }
</style>
</head>
<body>
<main>
  <h1>hover-intent-menu</h1>
  <p class="lede">
    Rest the pointer on "Collections" to open its menu. It opens only after the pointer has
    stayed on the item for a moment; passing over it does nothing.
  </p>

  <div class="nav">
    <div class="nav-item">
      <div class="nav-trigger">
        Collections
        <svg width="14" height="14" viewBox="0 0 16 16">
          <path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="nav-menu">
        <div class="row" data-idx="01">
          <div><span>Winter archive</span><div class="meta">42 items</div></div>
        </div>
        <div class="row" data-idx="02">
          <div><span>Field notebooks</span><div class="meta">17 items</div></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  const MECH = 'hover-intent';
  const VARIANT = 'menu';
  // How long the pointer must stay before the menu opens, as hover-intent menus do
  // so that a pointer passing over the bar does not flash every menu open.
  const INTENT_MS = 300;

  function assetUrl(idx) {
    return ['', 'sentinel', MECH, VARIANT, idx + '.png'].join('/');
  }

  const fetched = new Set();
  function fetchSentinel(idx) {
    if (fetched.has(idx)) return null;
    fetched.add(idx);
    const img = new Image();
    img.src = assetUrl(idx);
    return img;
  }

  const item = document.querySelector('.nav-item');
  const menu = item.querySelector('.nav-menu');
  let timer = null;

  // Not named open: a global function open() is window.open, which crawlers stub.
  function openMenu() {
    item.classList.add('is-open');
    Array.prototype.forEach.call(menu.querySelectorAll('.row'), function (row) {
      const img = fetchSentinel(row.dataset.idx);
      if (img) {
        img.alt = '';
        row.prepend(img);
      }
    });
  }

  item.addEventListener('mouseenter', function () {
    clearTimeout(timer);
    timer = setTimeout(openMenu, INTENT_MS);
  });
  item.addEventListener('mouseleave', function () {
    clearTimeout(timer);
    item.classList.remove('is-open');
  });
</script>
</body>
</html>
