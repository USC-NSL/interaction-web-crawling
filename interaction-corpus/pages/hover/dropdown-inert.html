<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>hover-dropdown-inert</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; padding: 32px 24px 96px;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #1b1b1f; background: #fbfbfd;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .lede { margin: 0 0 28px; color: #55555f; }
  .nav { position: relative; display: flex; gap: 8px; padding: 8px;
         border: 1px solid #d8d8e0; border-radius: 10px; background: #fff; }
  .nav-trigger {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    font-weight: 600; border-radius: 8px; cursor: default; user-select: none;
  }
  .nav-trigger:hover, .nav-trigger.is-open { background: #f0f0f6; }
  .nav-menu {
    position: absolute; top: 100%; left: 8px; margin-top: 6px; padding: 10px;
    min-width: 300px;
    border: 1px solid #d8d8e0; border-radius: 10px; background: #fff;
    box-shadow: 0 12px 28px rgba(20, 20, 40, 0.12);
    display: none;
  }
  .nav-menu.is-open { display: block; }
  .nav-menu .row { display: flex; align-items: center; gap: 12px; padding: 8px; }
  .nav-menu img { width: 64px; height: 44px; flex: none; background: #e4e4ee; border-radius: 4px; }
  .nav-menu .meta { font-size: 13px; color: #6a6a76; }
</style>
</head>
<body>
<main>
  <h1>hover-dropdown-inert</h1>
  <p class="lede">
    Hover the "Collections" item to open its menu. Hover is the only way in: the item is a
    plain div with no ARIA and no tabindex, it takes no focus, and clicking it does nothing.
  </p>

  <div class="nav">
    <div class="nav-trigger">
      Collections
      <svg width="14" height="14" viewBox="0 0 16 16">
        <path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="nav-menu">
      <div class="row" data-idx="01">
        <div><span>Winter archive</span><div class="meta">42 items</div></div>
      </div>
      <div class="row" data-idx="02">
        <div><span>Field notebooks</span><div class="meta">17 items</div></div>
      </div>
    </div>
  </div>
</main>

<script>
  const MECH = 'hover-dropdown';
  const VARIANT = 'inert';

  function assetUrl(idx) {
    return ['', 'sentinel', MECH, VARIANT, idx + '.png'].join('/');
  }

  const fetched = new Set();
  function fetchSentinel(idx) {
    if (fetched.has(idx)) return null;
    fetched.add(idx);
    const img = new Image();
    img.src = assetUrl(idx);
    return img;
  }

  const trigger = document.querySelector('.nav-trigger');
  const menu = document.querySelector('.nav-menu');

  // mouseover only. No focus handler, no click handler: nothing in the
  // accessibility tree marks this element as hoverable.
  trigger.addEventListener('mouseover', function () {
    trigger.classList.add('is-open');
    menu.classList.add('is-open');
    Array.prototype.forEach.call(menu.querySelectorAll('.row'), function (row) {
      const img = fetchSentinel(row.dataset.idx);
      if (img) row.prepend(img);
    });
  });

  document.querySelector('.nav').addEventListener('mouseleave', function () {
    trigger.classList.remove('is-open');
    menu.classList.remove('is-open');
  });
</script>
</body>
</html>
