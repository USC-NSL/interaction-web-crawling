<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>hover-css-menu</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; padding: 32px 24px 96px;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #1b1b1f; background: #fbfbfd;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .lede { margin: 0 0 28px; color: #55555f; }
  .nav { padding: 8px; border: 1px solid #d8d8e0; border-radius: 10px; background: #fff; }
  .nav-list { display: flex; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .nav-item { position: relative; }
  .nav-trigger {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    font-weight: 600; border-radius: 8px; cursor: default; user-select: none;
  }
  .nav-trigger:hover { background: #f0f0f6; }
  .nav-menu {
    position: absolute; top: 100%; left: 0; margin: 6px 0 0; padding: 10px;
    min-width: 300px; list-style: none;
    border: 1px solid #d8d8e0; border-radius: 10px; background: #fff;
    box-shadow: 0 12px 28px rgba(20, 20, 40, 0.12);
    display: none;
  }
  /* The whole reveal: no script opens this menu. */
  .nav-item:hover > .nav-menu { display: block; }
  .nav-menu li { display: flex; align-items: center; gap: 12px; padding: 8px; }
  .nav-menu .thumb {
    width: 64px; height: 44px; flex: none; border-radius: 4px;
    background: #e4e4ee center / cover no-repeat;
  }
  .nav-menu a { color: #1b1b1f; }
  .nav-menu .meta { font-size: 13px; color: #6a6a76; }
</style>
<style id="sentinel-rules"></style>
</head>
<body>
<main>
  <h1>hover-css-menu</h1>
  <p class="lede">
    Hover "Collections" to open its menu, which shows a thumbnail per row. The menu is pure
    CSS: nothing on the page listens for the pointer, and only a real hover opens it.
  </p>

  <nav class="nav" aria-label="Primary">
    <ul class="nav-list">
      <li class="nav-item">
        <span class="nav-trigger">
          Collections
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <ul class="nav-menu" aria-label="Collections">
          <li data-idx="01">
            <span class="thumb"></span>
            <div><a href="#winter">Winter archive</a><div class="meta">42 items</div></div>
          </li>
          <li data-idx="02">
            <span class="thumb"></span>
            <div><a href="#field">Field notebooks</a><div class="meta">17 items</div></div>
          </li>
        </ul>
      </li>
    </ul>
  </nav>
</main>

<script>
  const MECH = 'hover-css';
  const VARIANT = 'menu';

  function assetUrl(idx) {
    return ['', 'sentinel', MECH, VARIANT, idx + '.png'].join('/');
  }

  // Each thumbnail is a CSS background-image. The browser requests it the first time
  // the menu renders the row, and never for a row inside the closed (display: none)
  // menu. The rules go in through the CSSOM so no url() is in the served HTML, and no
  // script ever requests a thumbnail: there is no fetchSentinel on this page.
  const rules = document.getElementById('sentinel-rules').sheet;
  Array.prototype.forEach.call(document.querySelectorAll('.nav-menu [data-idx]'), function (row) {
    const idx = row.dataset.idx;
    rules.insertRule(
      '.nav-menu [data-idx="' + idx + '"] .thumb { background-image: url("' + assetUrl(idx) + '"); }',
      rules.cssRules.length);
  });
</script>
</body>
</html>
