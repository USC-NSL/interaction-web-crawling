<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>click-framehash-iframes</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 32px 24px 96px; font: 16px/1.55 -apple-system, BlinkMacSystemFont,
         "Segoe UI", Helvetica, Arial, sans-serif; color: #1b1b1f; background: #fbfbfd; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .lede { margin: 0 0 20px; color: #55555f; }
  iframe { display: block; width: 100%; height: 150px; margin: 0 0 12px; border: 1px solid #d8d8e0;
           border-radius: 8px; background: #fff; }
</style>
</head>
<body>
<main>
  <h1>click-framehash-iframes</h1>
  <p class="lede">
    Each example below is a same-origin frame with a "Show the answer" link. The link is an
    in-page anchor (href="#answer-N"), so clicking it adds a history entry in a frame that
    shares the page's session history. Click both links.
  </p>
  <iframe id="frame-1" title="Example 1" src="/pages/click/framehash-iframes-frame-1.html"></iframe>
  <iframe id="frame-2" title="Example 2" src="/pages/click/framehash-iframes-frame-2.html"></iframe>
</main>

<script>
  const MECH = 'click-framehash';
  const VARIANT = 'iframes';

  function assetUrl(idx) {
    return ['', 'sentinel', MECH, VARIANT, idx + '.png'].join('/');
  }

  // Fetch each sentinel at most once per page load: the guard is the first statement.
  const fetched = new Set();
  function fetchSentinel(idx) {
    if (fetched.has(idx)) return null;
    fetched.add(idx);
    const img = new Image();
    img.src = assetUrl(idx);
    return img;
  }

  // Called by the frames' reveal links. The sentinel logic lives here, in the page,
  // so the corpus mutations (which transform this file) apply to it.
  window.reveal = function (idx) {
    fetchSentinel(idx);
  };
</script>
</body>
</html>
