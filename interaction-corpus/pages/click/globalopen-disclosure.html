<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>click-globalopen-disclosure</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 32px 24px 96px; font: 16px/1.55 -apple-system, BlinkMacSystemFont,
         "Segoe UI", Helvetica, Arial, sans-serif; color: #1b1b1f; background: #fbfbfd; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .lede { margin: 0 0 20px; color: #55555f; }
  .card { border: 1px solid #d8d8e0; border-radius: 10px; background: #fff; padding: 14px 16px; }
  .card + .card { margin-top: 12px; }
  .disclose { font: inherit; padding: 4px 10px; border: 1px solid #c9c9d4; border-radius: 6px;
              background: #f3f3f8; cursor: pointer; }
  .panel[hidden] { display: none; }
  .panel img { display: block; width: 120px; height: 80px; margin-top: 8px; background: #e4e4ee; }
</style>
</head>
<body>
<main>
  <h1>click-globalopen-disclosure</h1>
  <p class="lede">
    Two cards, each with a button that shows its photo; clicking again hides it. The page's
    own script names its reveal function <code>open</code>, as older sites often do.
  </p>
  <div class="card" data-idx="01">
    <p>The harbour at dusk.</p>
    <button type="button" class="disclose" aria-expanded="false">Show photo</button>
    <div class="panel" hidden></div>
  </div>
  <div class="card" data-idx="02">
    <p>A ridge line in winter.</p>
    <button type="button" class="disclose" aria-expanded="false">Show photo</button>
    <div class="panel" hidden></div>
  </div>
</main>

<script>
  const MECH = 'click-globalopen';
  const VARIANT = 'disclosure';

  function assetUrl(idx) {
    return ['', 'sentinel', MECH, VARIANT, idx + '.png'].join('/');
  }

  const fetched = new Set();
  function fetchSentinel(idx) {
    if (fetched.has(idx)) return null;
    fetched.add(idx);
    const img = new Image();
    img.src = assetUrl(idx);
    return img;
  }

  // A global function declaration named open replaces window.open. The handlers
  // look it up by name at click time, so a crawler that stubs window.open after
  // load breaks this page unless it leaves a page-defined open alone.
  function open(idx) {
    const card = document.querySelector('.card[data-idx="' + idx + '"]');
    const panel = card.querySelector('.panel');
    panel.hidden = false;
    card.querySelector('.disclose').setAttribute('aria-expanded', 'true');
    const img = fetchSentinel(idx);
    if (img) {
      img.alt = '';
      panel.append(img);
    }
  }

  Array.prototype.forEach.call(document.querySelectorAll('.card'), function (card) {
    const button = card.querySelector('.disclose');
    const panel = card.querySelector('.panel');
    button.addEventListener('click', function () {
      if (panel.hidden) {
        open(card.dataset.idx);
      } else {
        panel.hidden = true;
        button.setAttribute('aria-expanded', 'false');
      }
    });
  });
</script>
</body>
</html>
