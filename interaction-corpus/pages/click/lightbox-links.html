<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>click-lightbox-links</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 32px 24px 96px; font: 16px/1.55 -apple-system, BlinkMacSystemFont,
         "Segoe UI", Helvetica, Arial, sans-serif; color: #1b1b1f; background: #fbfbfd; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .lede { margin: 0 0 28px; color: #55555f; }
  .gallery { display: flex; gap: 12px; }
  .gallery a { display: flex; align-items: flex-end; width: 160px; height: 110px; padding: 8px;
               border-radius: 8px; background: #dfe3f0; color: #1b1b1f; text-decoration: none; }
  /* A viewer panel below the gallery rather than a full-screen overlay, so an opened
     image never covers the other links (a real pointer click would land on it). */
  .overlay { margin-top: 16px; display: flex; justify-content: center; padding: 16px;
             border-radius: 10px; background: #1b1b2a; }
  .overlay[hidden] { display: none; }
  .overlay figure { margin: 0; padding: 16px; background: #fff; border-radius: 8px; }
  .overlay img { display: block; width: 320px; height: 220px; background: #e4e4ee; }
  #overlay-img:empty { width: 320px; height: 220px; background: #e4e4ee; }
  .overlay button { margin-top: 10px; font: inherit; }
</style>
</head>
<body>
<main>
  <h1>click-lightbox-links</h1>
  <p class="lede">
    Click each picture to open it in the viewer. Each picture is a link to its full-size
    image (another document), but a click handler cancels the navigation and loads the image
    into the viewer below.
  </p>
  <div class="gallery">
    <a href="/pages/other/lightbox/large-01.jpg" class="lb-link" data-idx="01">Harbour at dusk</a>
    <a href="/pages/other/lightbox/large-02.jpg" class="lb-link" data-idx="02">Ridge line</a>
    <a href="/pages/other/lightbox/large-03.jpg" class="lb-link" data-idx="03">Market street</a>
  </div>
  <div class="overlay" id="overlay" hidden>
    <figure>
      <div id="overlay-img"></div>
      <figcaption><button type="button" id="overlay-close">Close</button></figcaption>
    </figure>
  </div>
</main>

<script>
  const MECH = 'click-lightbox';
  const VARIANT = 'links';

  function assetUrl(idx) {
    return ['', 'sentinel', MECH, VARIANT, idx + '.png'].join('/');
  }

  // Fetch each sentinel at most once per page load: the guard is the first statement.
  const fetched = new Set();
  function fetchSentinel(idx) {
    if (fetched.has(idx)) return null;
    fetched.add(idx);
    const img = new Image();
    img.src = assetUrl(idx);
    return img;
  }

  const overlay = document.getElementById('overlay');
  const overlayImg = document.getElementById('overlay-img');
  document.querySelectorAll('.lb-link').forEach(function (link) {
    link.addEventListener('click', function (event) {
      event.preventDefault();          // a lightbox, not a navigation to image.jpg
      overlay.hidden = false;
      const img = fetchSentinel(link.dataset.idx);
      if (img) overlayImg.replaceChildren(img);   // the image fetchSentinel created
    });
  });
  document.getElementById('overlay-close').addEventListener('click', function () {
    overlay.hidden = true;
  });
</script>
</body>
</html>
